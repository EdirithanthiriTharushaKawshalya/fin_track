name: fin_track
description: "A professional personal finance tracker with futuristic UI."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.8.1 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2 # NEW: For persistent storage
  
  cupertino_icons: ^1.0.8

  # Backend & Auth
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  cloud_firestore: ^6.1.1

  # State Management
  flutter_riverpod: ^3.1.0

  # Navigation
  go_router: ^17.0.1

  # Typography & UI
  google_fonts: ^6.3.3
  fl_chart: ^1.1.1

  # Date & Data Formatting
  intl: ^0.20.2
  csv: ^6.0.0 # NEW: Required for financial data exporting

  # System Utilities
  share_plus: ^10.1.4 # NEW: Required for native sharing/saving dialogs
  path_provider: ^2.1.5 # NEW: Required for temporary file storage

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: "^0.13.1"

flutter:
  uses-material-design: true

  # Ensure your assets folder exists for the launcher icon
  assets:
    - assets/icon/icon.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21